name: 🚀 Publish Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without creating tag/release (Dry run)'
        required: false
        default: true
        type: boolean

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  WINGET_PACKAGE_ID: PTRTECH.NetSonar
  WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  extract_information:
    name: '🔍 Extract release information'
    uses: sn4k3/Actions/.github/workflows/extract-csproj-information.yml@main

  test:
    name: '🧪 Test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate localization resources
        shell: pwsh
        run: ./scripts/Validate-LocalizationResources.ps1

      - name: Restore dependencies
        run: dotnet restore tests/NetSonar.Tests/NetSonar.Tests.csproj

      - name: Run tests
        run: dotnet test tests/NetSonar.Tests/NetSonar.Tests.csproj --configuration Release --no-restore

  build:
    name: '🛠️ Publish asset (${{ matrix.rid }})'
    needs: [extract_information, test]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore NetSonar.slnx -p:NuGetAudit=false

      - name: Install Linux packaging tools
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm makepkg pacman-package-manager fakeroot zstd libarchive-tools
          command -v dpkg-deb
          command -v rpmbuild
          command -v makepkg
          command -v pacman
          command -v bsdtar

      - name: Publish runtime asset
        run: >-
          dotnet run --project builds/build/build.csproj
          --configuration Release --no-restore --
          Publish --rids ${{ matrix.rid }} --delete-publish-directories

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: artifacts/publish/*
          if-no-files-found: error

  create_tag:
    name: '🏷️ Create Tag'
    needs: [build, extract_information]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          version="${{ needs.extract_information.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release v$version"
          git push origin "$version"

  create_release:
    name: '🎉 Create Release'
    needs: [extract_information, build, create_tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.Version }}
          name: v${{ env.Version }}
          body: ${{ env.Changelog }}
          draft: false
          prerelease: ${{ contains(env.Version, '-alpha') || contains(env.Version, '-beta') || contains(env.Version, '-preview') || contains(env.Version, '-rc') }}
          files: release-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          Version: ${{ needs.extract_information.outputs.version }}
          Changelog: ${{ needs.extract_information.outputs.changelog }}

      - name: Delete tag if release fails
        if: failure()
        working-directory: repo
        run: |
          version="${{ needs.extract_information.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          git tag -d "$version"
          git push --delete origin "$version"

  winget:
    name: 🚀 Winget - Pull request
    runs-on: windows-latest
    needs: [create_release, extract_information]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read

    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: ${{ env.WINGET_PACKAGE_ID }}
          release-tag: ${{ needs.extract_information.outputs.version }}
          version: ${{ needs.extract_information.outputs.version }}
          token: ${{ env.WINGET_TOKEN }}

